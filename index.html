<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css">
    <title>Odin Sign-up Form</title>
</head>

<body>
    <div class="container">
        <div class="left">
            <img src="images/bambu.avif" alt="Bambú" class="bb">
            <div class="banner"></div>
            <div class="logo">
                <img class="odin-head" src="images/odin-head.png" alt="Odin Head">
                <p class="letter">ODIN</p>
            </div>
        </div>
        <div class="right">
            <div class="message">
                <p>This is not real online service! You know you need something like this in your life to help you realize your deepst dreams. Sign up <i>now</i> to get started.</p>
                <p>You <i>know</i> you want to.</p>
            </div>
            <form action="#" method="get">
                <fieldset>
                    <legend>Let's do this!</legend>
                    <div class="forms">
                        <label for="first_name">FIRST NAME</label>
                        <input type="text" name="first_name" id="first_name" maxlength="50" required>

                        <label for="email">EMAIL</label>
                        <input type="email" name="email" id="email" maxlength="225" required>

                        <label for="password">PASSWORD</label>
                        <input type="password" name="password" id="password" maxlength="150" required>
                    </div>
                    <div class="forms">
                        <label for="last_name">LAST NAME</label>
                        <input type="text" name="last_name" id="first_name" maxlength="50"" required>

                        <label for="phone_number">PHONE NUMBER</label>
                        <input type="text" name="phone_number" id="phone_number" maxlength="10" required>

                        <label for="confirm_password">CONFIRM PASSWORD</label>
                        <input type="password" name="confirm_password" id="confirm_password" maxlength="150" required>
                    </div>
                </fieldset>
            </form>
            <div class="cl">
                <button type="submit">Create Account</button>
                <p>Already have an account? <a href="#">Log in</a></p>
            </div>
        </div>
    </div>
</body>

</html>
